# PLAN §58 — the Sales module surface: /api/v1/Sales/* domain commands (Phase 19-S).
# Source: apps/api/src/sales/sales.controller.ts plus the services it calls
# (document/, payments/, pricing/, inventory/, subscriptions/, integrations/, tax/).
# Entity CRUD for Product, Quote, Invoice and friends stays on the generic /api/v1/:entity API
# (see entities.yaml); these routes are the commands a single record cannot express.
# Permissions are enforced server-side: requireAdmin() in the controller, AclApiService
# assertAccess/canUser in the services, and the report subsystem's own ACL for report runs.
# The three @Public() routes are the scheduled-job doors: session auth is skipped and the
# shared worker capability in `x-worker-secret` (REPORT_WORKER_SECRET, constant-time compare)
# is the authorisation.
# Format and required fields: api-spec/README.md §2.
group: sales
basePath: /api/v1
endpoints:
  - method: GET
    path: /api/v1/Sales/action/health
    auth: authenticated
    permissions: administrator
    request: none
    response: "200 ModuleHealthView { module, ok, dependencies[], optionalIntegrations[], features[], settings{version,warnings}, checks[] }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/Sales/action/nav
    auth: authenticated
    permissions: authenticated — a report, not a gate; answers which Sales entities the caller may read
    request: none
    response: "200 { visible, readableEntities, entities[] } — visible is true when the caller can read at least one Sales entity"
    errors: [AUTHENTICATION_REQUIRED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/Sales/action/settings
    auth: authenticated
    permissions: authenticated
    request: none
    response: "200 SalesSettingsView { settings, version, updatedAt, updatedBy, defaults, warnings[] }"
    errors: [AUTHENTICATION_REQUIRED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/action/settings
    auth: authenticated
    permissions: administrator
    request: "SalesSettingsPatchSchema — a partial settings object; unknown keys are refused, the merged result is re-validated"
    response: "200 SalesSettingsView with the bumped version"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [app_settings row \"sales\" upserted, settings version incremented, updatedAt/updatedBy stamped; a stored snapshot on a document names the version it was produced under]
    idempotency: a repeat with the same body bumps the version again
  - method: GET
    path: /api/v1/Sales/action/numbering
    auth: authenticated
    permissions: administrator
    request: none
    response: "200 { list: number series with the next unallocated number per series }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat; allocation itself happens at document issuance, not here
  - method: POST
    path: /api/v1/Sales/action/resolvePrice
    auth: authenticated
    permissions: "record ACL (Product read; PriceBook read when a price book is consulted)"
    request: "ResolvePriceSchema { productId, quantity?, currency?, accountId?, priceBookId?, date?, explicitPrice? } — canonical decimal strings"
    response: "200 ResolvedPrice | UnresolvedPrice { price?, source, reason, trace[] } — a missing price is never silently zero"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/action/resolveSupplierPrice
    auth: authenticated
    permissions: "record ACL (SupplierProductPrice read)"
    request: "ResolveSupplierPriceSchema { supplierId, productId, quantity?, currency?, date? } — the buying price only; it can never return a sales price"
    response: "200 SupplierPriceResolution { price?, reason, winning supplier price }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/action/bulkPriceUpdate
    auth: authenticated
    permissions: "record ACL (PriceBookEntry read for preview, edit for apply)"
    request: "BulkPriceUpdateSchema { mode: preview|apply, priceBookId, adjustment{type: percent|fixed|set, value}, productIds?, categoryIds?, limit? }"
    response: "200 BulkPriceResult { mode, changes[], skipped[], changedCount, applied, truncated, auditId }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: "limit bounds the entries scanned (default service-clamped, max 500); truncated reports a cut scan"
    sorting: none
    filtering: "productIds/categoryIds narrow the entries considered"
    sideEffects: [mode=apply writes the new PriceBookEntry prices plus an audit row, mode=preview writes nothing]
    idempotency: "preview is safe to repeat; apply re-prices from the stored values each call"
  - method: POST
    path: /api/v1/Sales/action/previewTotals
    auth: authenticated
    permissions: "authenticated; record ACL (Product read) when any line names a productId"
    request: "PreviewTotalsSchema { currency?, date?, taxInclusive?, accountId?, jurisdiction?, lines[1..500]{quantity, unitPrice, productId?, ...}, shipping?, documentDiscountAmount?, exchangeRate? }"
    response: "200 TotalsResult { lines[], subtotal, discountTotal, shippingAmount, shippingTaxAmount, taxTotal, netTotal, grossTotal, taxBreakdown[], currency } — every number recomputed server-side"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/document
    auth: authenticated
    permissions: "record ACL (create on the kind's entity: Quote|SalesOrder|Invoice|CreditNote|DeliveryOrder|ReturnOrder|PurchaseOrder|ReceiptOrder|Bill|BillCredit)"
    request: "CreateDocumentSchema { kind, data?, items[0..500] (DocumentLineSchema), exchangeRate?, correlationId? } — server-owned fields (number, status, totals, lock fields) are refused"
    response: "201 DocumentView { id, descriptor, document, items, totals, allowedActions } — a draft"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND, DUPLICATE_RECORD]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [document entity row, item entity rows, totals recomputed on save]
    idempotency: none; correlationId is stored for conversion idempotency, not dedup on create
  - method: GET
    path: /api/v1/Sales/document/:kind/:id
    auth: authenticated
    permissions: "record ACL (read on the kind's entity)"
    request: "path: kind (quote|salesOrder|invoice|creditNote|deliveryOrder|returnOrder|purchaseOrder|receiptOrder|bill|billCredit), id"
    response: "200 DocumentView { document, items, totals, allowedActions, fromSnapshot }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: PATCH
    path: /api/v1/Sales/document/:kind/:id
    auth: authenticated
    permissions: "record ACL (edit on the kind's entity)"
    request: "UpdateDocumentSchema { data?, items?, exchangeRate?, correlationId? } — omitted keys unchanged; a locked/issued document refuses changes to protected fields by name"
    response: "200 DocumentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [document and item rows rewritten, totals recomputed, outbox event]
    idempotency: a repeat with the same body is a no-op
  - method: POST
    path: /api/v1/Sales/document/:kind/:id/transition
    auth: authenticated
    permissions: "record ACL (edit on the kind's entity)"
    request: "DocumentTransitionSchema { action, reason?, correlationId? } — action names come from the descriptor's transition table"
    response: "200 DocumentView after the transition"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [issuing transition allocates the official number, immutable snapshot frozen, issuedAt/issuedBy stamped, lock policy applied, outbox event — all in one transaction, stock-moving kinds (salesOrder deliveryOrder returnOrder receiptOrder) also write inventory movements when features.inventory is on, void/cancel actions require a reason]
    idempotency: "a transition refused from the current state answers 422; replaying the same action is not silently repeated"
  - method: POST
    path: /api/v1/Sales/document/:kind/:id/unlock
    auth: authenticated
    permissions: "record ACL (edit on the kind's entity) plus administrator or the dedicated unlock-issued-documents permission"
    request: "DocumentUnlockSchema { reason } — mandatory, kept in the audit trail"
    response: "200 DocumentView — stays issued; unlockedAt/unlockedBy record the exception"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [unlockedAt/unlockedBy stamped on the document, outbox \"unlocked\" event with the reason]
    idempotency: a second unlock answers 422 (document is not locked)
  - method: POST
    path: /api/v1/Sales/document/:kind/:id/convert
    auth: authenticated
    permissions: "record ACL (read on the source entity and create on the target entity)"
    request: "DocumentConvertSchema { action, correlationId?, overrides? } — action names the conversion (e.g. quote accept → salesOrder)"
    response: "201 DocumentView of the new draft — values copied by value, never re-resolved from the catalog"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND, DUPLICATE_RECORD]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [new document and item rows with sourceEntity/sourceId provenance]
    idempotency: "safe to repeat with the same correlationId — it returns the document the first call created instead of a second one"
  - method: POST
    path: /api/v1/Sales/document/fromOpportunity
    auth: authenticated
    permissions: "record ACL (create on the target kind's entity; the Opportunity is read through the Entity Engine under the caller's own record access)"
    request: "CreateFromOpportunitySchema { opportunityId, kind (quote|salesOrder|invoice|creditNote), items[0..500], overrides?, correlationId? }"
    response: "201 DocumentView — a draft raised from the deal, with provenance written by the command"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND, DUPLICATE_RECORD]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [document and item rows; double-billing guards refuse a second billable document for the same opportunity lines]
    idempotency: "correlationId is stored; a genuinely repeated conversion is refused by the duplicate guard rather than merged"
  - method: POST
    path: /api/v1/Sales/document/:kind/:id/render
    auth: authenticated
    permissions: "record ACL (read on the kind's entity)"
    request: "RenderDocumentSchema { templateCode? } — the entity type's default template, or the built-in block layout when none is configured"
    response: "200 DocumentRenderResult { kind, number, status, fromSnapshot, templateCode, format, subject, body, text, blocks[], warnings[], pdf{available,reason} } — an issued document renders from its frozen snapshot"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/document/:kind/:id/recalculate
    auth: authenticated
    permissions: "record ACL (read on the kind's entity)"
    request: none
    response: "200 TotalsResult recomputed from the server's own numbers"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [totals fields rewritten on a draft, an issued document is never rewritten by this command]
    idempotency: safe to repeat — recalculation is deterministic
  - method: DELETE
    path: /api/v1/Sales/document/:kind/:id
    auth: authenticated
    permissions: "record ACL (delete on the kind's entity)"
    request: none
    response: "204 no content"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [document and item rows removed — drafts only; an issued document answers 422 and must be voided or credited instead]
    idempotency: a second delete answers 404
  - method: POST
    path: /api/v1/Sales/quote/:id/render
    auth: authenticated
    permissions: "record ACL (Quote read; DocumentTemplate read when a named/default template renders)"
    request: "RenderQuoteSchema { templateCode? }"
    response: "200 QuoteRenderResult { quoteId, number, status, fromSnapshot, templateCode, format, subject, body, text, blocks[], warnings[], pdf }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/quote/:id/send
    auth: authenticated
    permissions: "record ACL (Quote read via the document view, plus Email create and edit)"
    request: "SendQuoteSchema { to?, cc?, bcc?, templateCode?, subject?, message?, emailAccountId?, correlationId?, attachPdf? } — recipients default to the contact's then the account's address"
    response: "200 SendQuoteResult { quote, email, rendered, transport, job, issued, pdfAttachment }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND, FEATURE_DISABLED, INTERNAL_ERROR]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [a draft is issued first — number allocated, snapshot frozen, locked — via the send transition, an Email record is created and queued through EmailService (system.sendEmail job for the worker), attachPdf stores a PDF attachment on the email, a missing recipient, disabled mail transport or missing pdfkit is refused before issuance, a queue failure after issuance leaves the email Draft and the error says so]
    idempotency: "re-sending an already-sent quote re-renders from the snapshot and records a new email without re-issuing"
  - method: POST
    path: /api/v1/Sales/document/:kind/:id/send
    auth: authenticated
    permissions: "record ACL (read on the kind's entity via the document view, plus Email create and edit)"
    request: "SendDocumentSchema (= SendQuoteSchema) { to?, cc?, bcc?, templateCode?, subject?, message?, emailAccountId?, correlationId?, attachPdf? } — kind=quote is refused here (use the quote route); recipients default to supplier for purchasing kinds, else contact then account"
    response: "200 SendDocumentResult { kind, document, email, rendered, transport, job, issued, pdfAttachment }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND, FEATURE_DISABLED, INTERNAL_ERROR]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [a draft is issued through its own issuing transition — number, snapshot, lock, outbox event, an Email record is created and queued for the worker, a draft of a stock-moving kind is refused — confirm it first so stock moves deliberately]
    idempotency: "re-sending an issued document records another email without touching the document"
  - method: POST
    path: /api/v1/Sales/payment
    auth: authenticated
    permissions: "record ACL (Payment create)"
    request: "CreatePaymentSchema { amount, currency?, direction: incoming|outgoing, date?, paymentMethodId?, paymentChannelId?, accountId?, contactId?, supplierId?, reference?, memo?, exchangeRate? } — balances are derived, never supplied"
    response: "201 PaymentView { id, status: draft, direction, amount, currency, base*, balance, payment }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Payment row with derived allocated/unallocated amounts and frozen exchange-rate snapshot]
    idempotency: none; each call records a new payment
  - method: GET
    path: /api/v1/Sales/payment/:id
    auth: authenticated
    permissions: "record ACL (Payment read)"
    request: none
    response: "200 PaymentView — balance recomputed live from the allocation rows"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: PATCH
    path: /api/v1/Sales/payment/:id
    auth: authenticated
    permissions: "record ACL (Payment edit)"
    request: "UpdatePaymentSchema { amount?, paymentDate?, paymentMethodId?, paymentChannelId?, accountId?, contactId?, supplierId?, reference?, memo?, exchangeRate? } — amount/currency/direction/exchangeRate are refused once anything is allocated"
    response: "200 PaymentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Payment row updated, base-currency figures re-derived from the frozen snapshot]
    idempotency: a repeat with the same body is a no-op
  - method: POST
    path: /api/v1/Sales/payment/:id/transition
    auth: authenticated
    permissions: "record ACL (Payment edit)"
    request: "PaymentTransitionSchema { action, reason? } — confirm makes a payment allocatable; cancel requires a reason and is refused while allocations exist"
    response: "200 PaymentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Payment.status updated, outbox event payment.<action>]
    idempotency: "an action not allowed from the current state answers 422"
  - method: GET
    path: /api/v1/Sales/payment/:id/allocations
    auth: authenticated
    permissions: "record ACL (Payment read)"
    request: none
    response: "200 { list: AllocationView[] } — newest first, capped at 500 rows"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: "none; bounded at 500 allocation rows per payment"
    sorting: "allocatedAt descending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/payment/:id/allocate
    auth: authenticated
    permissions: "record ACL (Payment edit and edit on the target document entity — Invoice or Bill)"
    request: "AllocatePaymentSchema { documentId, documentEntity?, amount, correlationId? } — documentEntity defaults to Invoice; an incoming payment settles invoices, an outgoing one bills"
    response: "201 AllocationResult { allocation, payment{allocated,unallocated,status}, document{amountDue,paymentStatus} }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [one transaction locking payment then document: PaymentAllocation row created, both balances recomputed, outbox sales.payment.allocated, over-allocation/unconfirmed payment/non-issued document/cross-currency without snapshot are all refused]
    idempotency: "row locks plus balance recompute make a concurrent double-allocation impossible; a literal retry would be refused as over-allocation"
  - method: POST
    path: /api/v1/Sales/payment/:id/transfer
    auth: authenticated
    permissions: "record ACL (Payment edit)"
    request: "PaymentTransferSchema { toPaymentId, amount } — same currency required; a payment cannot transfer to itself"
    response: "200 PaymentTransferAllocation record"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [PaymentTransferAllocation row, outbox sales.payment.transferred]
    idempotency: none; each call records a new transfer up to the unallocated remainder
  - method: DELETE
    path: /api/v1/Sales/allocation/:id
    auth: authenticated
    permissions: "record ACL (Payment edit)"
    request: none
    response: "204 no content"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [PaymentAllocation row removed inside a transaction that locks payment then document, both balances recomputed, outbox sales.payment.unallocated — the removal is evented, never silent]
    idempotency: a second delete answers 404
  - method: GET
    path: /api/v1/Sales/allocatableDocuments
    auth: authenticated
    permissions: "record ACL (Invoice read for direction=incoming, Bill read for direction=outgoing)"
    request: "query: direction? (incoming|outgoing, default incoming), accountId?, supplierId?, limit?, offset?"
    response: "200 { list: issued documents with outstanding amount, hasMore, limit, offset } — only documents that still owe money"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY]
    pagination: "limit (default 100, max 500) and offset over eligible documents; hasMore reports more pages"
    sorting: "service-defined order (chronological scan)"
    filtering: "direction plus accountId (invoices) or supplierId (bills)"
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/creditNote/:id/allocate
    auth: authenticated
    permissions: "record ACL (CreditNote edit and Invoice edit)"
    request: "CreditNoteAllocateSchema { invoiceId, amount, correlationId? }"
    response: "201 allocation result — the credit note's unallocatedAmount and the invoice's amountDue both recompute"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [CreditNoteAllocation row, credit note and invoice balances recomputed under row locks, outbox event]
    idempotency: "over-allocation is refused; a retry after success would be refused the same way"
  - method: DELETE
    path: /api/v1/Sales/creditNote/allocation/:id
    auth: authenticated
    permissions: "record ACL (CreditNote edit and Invoice edit)"
    request: "CreditNoteUnallocateSchema { reason?, correlationId? } — body optional fields"
    response: "200 reversal result — the allocation row is kept and marked reversed, never deleted"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [allocation marked reversed with audit fields, both balances recomputed, outbox event]
    idempotency: "a second reversal of the same allocation answers 422/404 rather than double-restoring"
  - method: GET
    path: /api/v1/Sales/creditNote/allocatableInvoices
    auth: authenticated
    permissions: "record ACL (Invoice read)"
    request: "query: creditNoteId?, accountId?, limit?, offset?"
    response: "200 { list: issued invoices with outstanding amount, hasMore, limit, offset }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY]
    pagination: "limit (default 100, max 500) and offset; hasMore reports more pages"
    sorting: "service-defined order"
    filtering: "creditNoteId and accountId narrow the candidates"
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/creditNote/:id/render
    auth: authenticated
    permissions: "record ACL (CreditNote read via the document view; DocumentTemplate read when a template renders)"
    request: "RenderCreditNoteSchema { templateCode? }"
    response: "200 CreditNoteRenderResult { creditNoteId, number, status, fromSnapshot, templateCode, format, subject, body, text, blocks[], warnings[], pdf }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/Sales/write-off
    auth: authenticated
    permissions: "record ACL (WriteOff create and Invoice edit)"
    request: "WriteOffCreateSchema { invoiceId, amount, reason, correlationId? } — reason is mandatory and stays on the record"
    response: "201 pending WriteOff — a request changes no balance"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [WriteOff row with status pending]
    idempotency: none; each call files a new request
  - method: POST
    path: /api/v1/Sales/write-off/:id/approve
    auth: authenticated
    permissions: administrator
    request: "WriteOffApproveSchema { correlationId? }"
    response: "200 approved WriteOff — re-checked against the live invoice balance at decision time"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [WriteOff approved with approvedBy/approvedAt, invoice amountDue reduced, audit + outbox event]
    idempotency: "approving a non-pending write-off answers 422"
  - method: POST
    path: /api/v1/Sales/write-off/:id/reject
    auth: authenticated
    permissions: administrator
    request: "WriteOffRejectSchema { reason?, correlationId? }"
    response: "200 rejected WriteOff — the request stays on record; the invoice is untouched"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [WriteOff status rejected with decision audit]
    idempotency: "rejecting a non-pending write-off answers 422"
  - method: POST
    path: /api/v1/Sales/write-off/:id/reverse
    auth: authenticated
    permissions: administrator
    request: "WriteOffReverseSchema { reason, correlationId? } — reason mandatory"
    response: "200 reversed WriteOff — the invoice balance is restored; the record keeps both entries"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [WriteOff reversed with reversedBy/reversedAt/reversalReason, invoice amountDue restored, audit + outbox event]
