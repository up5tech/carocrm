    path: /api/v1/MarketingAutomation/action/attribution
    auth: authenticated
    permissions: administrator
    request: "body { campaignId?, sendId?, journeyId?, outcome? (default converted), referenceType?, referenceId?, correlationId? }"
    response: "200 { id, duplicate } — a normalized marketing_events conversion row"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [marketing_events row (provider internal, normalized_type conversion) with outcome and reference in properties]
    idempotency: "correlationId dedupes via uq_marketing_events_internal_attribution; a repeat answers the existing id with duplicate=true"
  - method: POST
    path: /api/v1/MarketingAutomation/action/portal/preferences
    auth: authenticated
    permissions: "authenticated portal principal — scope.principal.contactId is required; a principal without contactId fails"
    request: "body { consent: boolean (required), purpose? (default ProductMarketing) }"
    response: "200 { status } — the resulting consent status for the contact's own address"
    errors: [AUTHENTICATION_REQUIRED, INTERNAL_ERROR, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingConsent row for the contact's email to Consented or OptedOut plus history row; the contact record itself is not modified]
    idempotency: a repeat with the same consent value is a no-op consent write (changed=false internally)
  - method: POST
    path: /api/v1/MarketingAutomation/action/crossModuleEvent
    auth: authenticated
    permissions: administrator
    request: "body { eventType (required — same whitelist as journey trigger), sourceModule? (default unknown), entityType?, entityId?, emailHash?, payload?, causationDepth? (max 3), correlationId? }"
    response: "200 { accepted, reason? } — EVENT_NOT_WHITELISTED or CAUSATION_DEPTH_EXCEEDED refusals are answers, not errors"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [marketing_events row (provider = sourceModule, normalized_type provider_event) for audit/trace only — never an enrollment]
    idempotency: none — each accepted call inserts an event row
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/attribution
    auth: authenticated
    permissions: "record ACL (Campaign) — read"
    request: "query: model? (first_touch|last_touch|influenced — default influenced)"
    response: "200 AttributionReport { campaignId, model, asOf, touches, uniqueRecipients, conversions, conversionRate, influencedRevenue, note }"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: "model selects the attribution label; the aggregate itself is model-agnostic today"
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/funnel
    auth: authenticated
    permissions: "record ACL (Campaign) — read"
    request: none
    response: "200 FunnelReport { campaignId, asOf, stages: [{ stage, count }] ordered by first receipt, dropOff: [{ from, to, rate }] }"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: stages ordered by earliest received_at"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/retention/dryRun
    auth: authenticated
    permissions: administrator
    request: "body { olderThanDays? (default 365) }"
    response: "200 RetentionDryRun { cutoff, marketingEvents, recipientDeliveriesSent, note } — counts only; suppression records are never deleted"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    # dry run writes nothing
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/diagnostics
    auth: authenticated
    permissions: administrator
    request: none
    response: "200 MarketingDiagnostics { generatedAt, deliveryStates { state: count }, deadLetters, stuckSending } — counts only, no PII or secrets"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/public/click
    auth: public
    permissions: "public redirect — the to query must be a rooted path (never //host or /\\host) or an absolute URL on the configured delivery.publicBaseUrl origin; anything else answers INVALID_QUERY so the endpoint cannot be an open redirect"
    request: "query: to (required — redirect target)"
    response: "302 redirect to the validated same-origin target"
    errors: [INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    # engagement events arrive via the provider webhook, never this route
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/public/open
    auth: public
    permissions: public
    request: none
    response: "200 image/gif — a fixed 43-byte transparent 1×1 GIF with no-store cache headers; records no event and carries no per-recipient identifier"
    errors: []
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
