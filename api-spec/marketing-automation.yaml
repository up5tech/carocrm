# PLAN §58 — marketing automation command surface (Phase 19-MA).
# Source: apps/api/src/marketing-automation/marketing-automation.controller.ts and the services it calls
# (campaign, send, delivery batch, audience, consent, suppression, public tokens, journeys, forms,
# integration, attribution, retention, operations, event ingestion, template, test send).
# Entity CRUD for Campaign/TargetList/MarketingSend-adjacent records stays on the generic /api/v1/:entity
# API; these routes are the module commands that a single record cannot express.
# Auth: routes without @Public() require a session, API key or portal principal (cookie unsafe methods
# also need the CSRF double-submit). requireAdmin() routes are administrator-only. @Public() routes are
# authorised by a token, an HMAC signature or the x-worker-secret capability instead of a principal.
# Format and required fields: api-spec/README.md §2.
group: marketing-automation
basePath: /api/v1
endpoints:
  - method: GET
    path: /api/v1/MarketingAutomation/action/health
    auth: authenticated
    permissions: administrator
    request: none
    response: "200 ModuleHealthView { module, ok, dependencies[], optionalIntegrations[], features[], provider { configuredKey, resolvedKey, mode, live, testSend }, settings { version, warnings[] }, checks[] } — read live from metadata registry, information_schema, hook registry and provider registry"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/settings
    auth: authenticated
    permissions: authenticated — any signed-in principal may read the settings document
    request: none
    response: "200 MarketingAutomationSettingsView { settings, version, updatedAt, updatedBy, defaults, warnings[] } — validated defaults when no row is stored"
    errors: [AUTHENTICATION_REQUIRED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/settings
    auth: authenticated
    permissions: administrator
    request: "SettingsPatchSchema — a record of partial settings merged over the stored row; unknown keys and schema violations are refused; provider.key must name a registered adapter"
    response: "200 MarketingAutomationSettingsView (version incremented)"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [app_settings row upserted under name marketingAutomation, version bump, updatedBy recorded]
    idempotency: a repeat with the same patch re-merges and bumps the version again; no dedupe key
  - method: GET
    path: /api/v1/MarketingAutomation/action/nav
    auth: authenticated
    permissions: authenticated — a visibility report, never a gate; every hidden route is refused server-side anyway
    request: none
    response: "200 { visible, readableEntities, entities[] } — the Marketing Automation entities this caller may read, in module order"
    errors: [AUTHENTICATION_REQUIRED]
    pagination: none
    sorting: "fixed: module entity order"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/globalSendPause
    auth: authenticated
    permissions: administrator
    request: "GlobalSendPauseSchema { paused: boolean, reason?: string (required when pausing is implied; resuming takes none) }"
    response: "200 MarketingAutomationSettingsView — the emergency stop (§13) applied to safety.globalSendPaused"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [app_settings row upserted, safety.globalSendPaused and reason written, version bump; while paused every send-readiness and delivery gate refuses]
    idempotency: a repeat with the same body is a no-op settings write that still bumps the version
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/capabilities
    auth: authenticated
    permissions: "record ACL (Campaign) — read; mayEdit and allowedCommands are computed from the caller's edit grant"
    request: none
    response: "200 CampaignCapabilities { campaignId, status, mayEdit, allowedCommands[], lastValidatedAt, validationHash, report: CampaignValidationReport }"
    errors: [AUTHENTICATION_REQUIRED, RECORD_NOT_FOUND, AUTHORIZATION_DENIED, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/history
    auth: authenticated
    permissions: "record ACL (Campaign) — read"
    request: none
    response: "200 { list: CampaignTransitionView[] } — command, from/to status, actor, reason, validationHash, idempotencyKey, occurredAt; oldest first"
    errors: [AUTHENTICATION_REQUIRED, RECORD_NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: occurredAt ascending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/log
    auth: authenticated
    permissions: "record ACL (Campaign) — read; recipient identity on unreadable records is nulled and counted in hidden"
    request: "query: type? (normalized event type), limit? (default 50, max 500), offset? (default 0)"
    response: "200 { records: CampaignLogEntry[], total, hidden } — marketing_events rows newest first"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: "limit (default 50, max 500) and offset (default 0); total is the filtered count"
    sorting: "fixed: received_at descending"
    filtering: "type filters on normalized_type only"
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/stats
    auth: authenticated
    permissions: "record ACL (Campaign) — read"
    request: none
    response: "200 CampaignStats { campaignId, asOf, events { total, byType[] }, delivery { sent, delivered, bounced, complained, unsubscribed, opened, clicked }, uniqueRecipients }"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/validate
    auth: authenticated
    permissions: "record ACL (Campaign) — read to compute; the stored report is written only with edit"
    request: "query: as? (target CampaignStatus — validates as though the campaign were about to become it)"
    response: "200 CampaignValidationReport { campaignId, status, valid, blockers[], warnings[], checkedAt, validationHash }"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED, INVALID_QUERY, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.validationReport, validationHash and lastValidatedAt updated when the caller may edit]
    idempotency: safe to repeat; each call recomputes and re-stamps
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/transition
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignTransitionSchema { command?, to?, reason?, idempotencyKey?, version? } — command or to required; ambiguous targets (Running, Archived) must name the command"
    response: "200 CampaignTransitionResult { campaignId, from, to, command, changed, idempotent, transitionId, blockers? }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign status and lifecycle stamps, CampaignTransition history row, domain event marketingAutomation.campaign.* — all in one transaction; schedule/start/resume are gated on the send-readiness report; cancel requires a reason]
    idempotency: "idempotencyKey replays return the original transition (changed=false, idempotent=true); version enables optimistic concurrency"
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/schedule
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to schedule"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status=Scheduled with scheduledAt (and default timezone when unset), CampaignTransition row, domain event; refused when the send-readiness report has blockers or the global send pause is active]
    idempotency: same as transition — idempotencyKey replay is a no-op
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/unschedule
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to unschedule"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status back to Draft, scheduledAt cleared, CampaignTransition row, domain event]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/start
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to start"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status=Running with startedAt, CampaignTransition row, domain event; gated on the send-readiness report]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/pause
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to pause"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status=Paused with pausedAt, CampaignTransition row, domain event]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/resume
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to resume"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status=Running with resumedAt, CampaignTransition row, domain event; gated on the send-readiness report]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/complete
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to complete"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status=Completed with completedAt, CampaignTransition row, domain event]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/cancel
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason (required — §10.2), idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to cancel"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.status=Cancelled, cancelledAt and archivedAt set, CampaignTransition row, domain event; stops the campaign's remaining messages]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/archive
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "CampaignCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 CampaignTransitionResult — command fixed to archive"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [Campaign.archivedAt set, CampaignTransition row, domain event]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/duplicateAsDraft
    auth: authenticated
    permissions: "record ACL (Campaign) — read on the source; the copy is created through the entity engine"
    request: "CampaignDuplicateSchema { name?, code?, includeAudience? (default true), includeContent? (default true), idempotencyKey? } — delivery history, recipient state, enrollments and provider ids are never copied"
    response: "200 Campaign record — a fresh Draft"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, RECORD_NOT_FOUND, FEATURE_DISABLED, DUPLICATE_RECORD]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [new Campaign row, CampaignTransition row (command duplicate), included/excluded target-list links copied when includeAudience, domain event marketingAutomation.campaign.duplicated — one transaction]
    idempotency: idempotencyKey is stored on the transition row; a replay is not deduped by the service, so a repeated call creates another draft
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/previewContent
    auth: authenticated
    permissions: "record ACL (Campaign) — read; the linked template and a named sample recipient must also be readable"
    request: "ContentPreviewSchema { recipientType? (Contact|Lead), recipientId? } — recipientId requires recipientType; empty body renders without a recipient"
    response: "200 ContentPreview { subject, plainText, bodyHtml, findings[], templateContentHash, systemLinks, campaignId, templateId, recipient, recipientResolved, latestRevision, generatedAt }"
    errors: [AUTHENTICATION_REQUIRED, RECORD_NOT_FOUND, AUTHORIZATION_DENIED, VALIDATION_FAILED, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/contentRevision
    auth: authenticated
    permissions: "record ACL (Campaign) — edit"
    request: "EmptyCommandBodySchema — strict empty object"
    response: "200 SealedRevisionSummary { revisionId, revisionNumber, contentHash, templateId, campaignId, sealedAt, reused } — reused=true when identical content was already sealed"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, RECORD_NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingTemplateRevision row (immutable), domain event marketingAutomation.template.revisionSealed — only when the content hash is new]
    idempotency: "sealing identical content returns the existing revision (reused=true); no second row"
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/contentRevisions
    auth: authenticated
    permissions: "record ACL (Campaign) — read via entities.get"
    request: none
    response: "200 { campaignId, templateId, revisions: RevisionHeader[] } — newest first; empty list when the campaign has no template"
    errors: [AUTHENTICATION_REQUIRED, RECORD_NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: newest revision first"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/sendTest
    auth: authenticated
    permissions: "record ACL (Campaign) — edit; recipients must additionally be on the administrator-configured provider.testSend allowlist"
    request: "TestSendSchema { recipients: string[] (1–20 explicit addresses), confirm: boolean (required true when configured), recipientType?, recipientId?, idempotencyKey? }"
    response: "200 TestSendView { testSend: true, campaignId, provider, subject, recipients: receipts[], accepted, errorKind?, error?, contentHash, findings[], markers, duplicate, sentAt } — never a credential or raw provider body"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [synchronous provider call to the configured live adapter under the provider limiter (verify + send), subject/banner/test header marking; suppression checked per recipient; NO campaign state, snapshot, ledger row or marketing event is written]
    idempotency: "idempotencyKey (or a derived content+actor fingerprint) returns the recorded answer with duplicate=true within a 10-minute in-process window"
  - method: POST
    path: /api/v1/MarketingAutomation/action/campaign/:id/sends
    auth: authenticated
    permissions: "record ACL (Campaign) — edit; only Email/Newsletter/Informational campaigns may hold sends"
    request: "SendCreateSchema { slot? (1–100, default 1), name?, idempotencyKey? }"
    response: "200 MarketingSendView — the new send in status Draft with empty counts and no approval"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend row created as Draft]
    idempotency: none for creation; a taken slot answers VALIDATION_FAILED (SEND_SLOT_TAKEN); idempotencyKey is accepted but not deduped on create
  - method: GET
    path: /api/v1/MarketingAutomation/action/campaign/:id/sends
    auth: authenticated
    permissions: "record ACL (Campaign) — read"
    request: none
    response: "200 { campaignId, list: MarketingSendView[] } — newest first, each with decision state, ledger totals and allowedCommands"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: createdAt descending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/send/:id
    auth: authenticated
    permissions: "record ACL (Campaign) — read, enforced through the send's parent campaign"
    request: none
    response: "200 MarketingSendView { id, name, campaignId, slot, status, purpose, providerKey, templateRevisionId, contentHash, snapshotId, counts, approval, validation { hash, report }, lifecycle, deliveries, allowedCommands, mayEdit, stale, createdAt }"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/MarketingAutomation/action/send/:id/history
    auth: authenticated
    permissions: "record ACL (Campaign) — read, enforced through the send's parent campaign"
    request: none
    response: "200 { list: SendTransitionView[] } — command, from/to status, reason, actor, validationHash, approvalHash, snapshotId, occurredAt; oldest first"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: occurredAt ascending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/dryRun
    auth: authenticated
    permissions: "record ACL (Campaign) — read, enforced through the send's parent campaign; refused for callers who cannot read the campaign"
    request: "EmptyCommandBodySchema — strict empty object"
    response: "200 SendDryRunReport — resolved audience counts per category with reasons, campaign findings and approval state; writes nothing"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND, AUTHORIZATION_DENIED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/validate
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign"
    request: "EmptyCommandBodySchema — strict empty object"
    response: "200 MarketingSendView — status Validated with the frozen decision"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [one transaction: content revision sealed, final audience snapshot created (send-bound, superseding earlier ones), delivery ledger materialised per resolved recipient, validationHash and report stored, previous approval cleared, history row, domain event marketingAutomation.send.validated; a blocked report is recorded on lastErrorCode and refused with VALIDATION_FAILED]
    idempotency: re-validating is safe — the ledger decides what may be replaced and already-messaged recipients are never re-derived
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/approve
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign; requires status Validated and an unchanged material hash"
    request: "SendApprovalSchema { note?, idempotencyKey?, version? }"
    response: "200 MarketingSendView — approvalHash bound to the validated facts"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend approval fields (approvedById/approvedAt/approvalHash/note), history row, domain event marketingAutomation.send.approved; a stale validation invalidates the send back to Draft and refuses]
    idempotency: a repeat re-stamps the approval for the same hash; idempotencyKey is recorded on the history row
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/revokeApproval
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign"
    request: "SendRevokeApprovalSchema { reason (required), idempotencyKey? }"
    response: "200 MarketingSendView — status Draft with approval cleared"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend approval cleared and status Draft, lastErrorCode SEND_APPROVAL_REVOKED, history row, domain event marketingAutomation.send.approvalRevoked]
    idempotency: a second revoke answers VALIDATION_FAILED (SEND_APPROVAL_ABSENT)
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/transition
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign"
    request: "SendTransitionSchema { command? (schedule|queue|pause|resume|cancel|complete — fail is system-only and refused), to?, reason?, idempotencyKey?, version? } — command or to required"
    response: "200 SendTransitionResult { sendId, from, to, command, changed, idempotent, transitionId, cancelledDeliveries?, deliveryJobId?, deliveryQueueNote? }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, INVALID_QUERY, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend status and lifecycle stamps, open delivery rows cancelled on cancel, history row, domain event; queue/resume enqueue the marketing.deliveryBatch job after commit (a queue outage is reported, not thrown, and the scheduled sweep recovers)]
    idempotency: idempotencyKey replay returns the original transition; version enables optimistic concurrency
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/schedule
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign"
    request: "SendCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 SendTransitionResult — command fixed to schedule"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend.status=Scheduled with scheduledAt, history row, domain event; requires a live approval for the current material hash and a Scheduled/Running campaign]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/queue
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign"
    request: "SendCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 SendTransitionResult — command fixed to queue; hands the send to the delivery runtime"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend.status=Queued with queuedAt, history row, domain event, marketing.deliveryBatch job enqueued (deliveryJobId or deliveryQueueNote); requires a bound live provider, lifted global send pause and current approval — nothing is handed to a provider by this route itself]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/pause
    auth: authenticated
    permissions: "record ACL (Campaign) — edit, enforced through the send's parent campaign"
    request: "SendCommandBodySchema { reason?, idempotencyKey?, version? }"
    response: "200 SendTransitionResult — command fixed to pause"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, CONCURRENCY_CONFLICT]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [MarketingSend.status=Paused with pausedAt, history row, domain event]
    idempotency: same as transition
  - method: POST
    path: /api/v1/MarketingAutomation/action/send/:id/resume
