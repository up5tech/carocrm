# PLAN §58 — Phase 19 AI Agents module: diagnostics, definitions, runs, approvals,
# conversations/memory, evaluations, pricing/quotas, providers and the worker doors.
# Source: apps/api/src/ai-agents/ai-agents.controller.ts and the services it calls
# (definitions, runs, approvals, memory, evaluations, pricing, quota, settings, policy,
# provider connections, gateway, module health).
# Authorization is per-route: the controller checks AIAgentsPermissionService capabilities
# (synthetic ACL resources such as AIAgent/AIAgentPolicy) and several services re-check;
# run/conversation/agent reads are additionally scoped to owner, team or the `audit`
# capability. The five `action/worker/*` routes are @Public() and are authorized only by
# the shared `x-worker-secret` header.
# Format and required fields: api-spec/README.md §2.
group: ai-agents
basePath: /api/v1
endpoints:
  - method: GET
    path: /api/v1/AIAgents/action/health
    auth: authenticated
    permissions: "capability use (AIAgent read); provider connection keys/default are only revealed to a caller who also holds providerAdmin"
    request: none
    response: "200 AIAgentsModuleHealthView { module, ok, execution, dependencies[], optionalIntegrations[], features[], structures[], providers{count,enabledCount,credentialCount,adapterKeys,adapters,capabilityTable{adapters[{key,label,capabilities{chat,structuredOutput,structuredOutputMode,toolCalling,streaming,contextWindowTokens,imageInput,nativeWebSearch,reportsUsage}}],presets[{key,label,kind,verification,capabilities|null}]},presets,defaultKey,defaultResolvable,encryptionConfigured}, settings{version,updatedAt,warnings}, checks[] }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/capabilities
    auth: authenticated
    permissions: "capability use (AIAgent read)"
    request: none
    response: "200 { capabilities: [{key,label,description,granted}], execution{enabled,paused,available}, memory{enabled}, evaluations{enabled} }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/settings
    auth: authenticated
    permissions: "capability policyAdmin (AIAgentPolicy edit)"
    request: none
    response: "200 AIAgentsSettingsView { settings{features,provider,limits,approval,retention,safety,tools,dataPolicy}, version, updatedAt, updatedBy, defaults, warnings[] }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/settings
    auth: authenticated
    permissions: "capability policyAdmin (AIAgentPolicy edit); the service re-checks AIAgentPolicy edit"
    request: "settings patch object (deep-merged into the aiAgents row, then validated by the strict AIAgentsSettingsSchema; unknown keys refused)"
    response: "200 AIAgentsSettingsView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [app_settings row 'aiAgents' upserted with version+1 and updatedBy]
    idempotency: a repeat of the same patch is a no-op; every accepted write bumps version
  - method: GET
    path: /api/v1/AIAgents/action/providers
    auth: authenticated
    permissions: "capability providerAdmin (AIAgentProvider edit)"
    request: none
    response: "200 { list: ProviderConnectionView[] } ordered by key — never contains apiKey, only hasApiKey"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: key ascending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/providers/:key
    auth: authenticated
    permissions: "capability providerAdmin (AIAgentProvider edit)"
    request: none
    response: "200 ProviderConnectionView { id, key, kind, label, baseUrl, models[], dataClasses[], hasApiKey, config, enabled, createdAt, modifiedAt }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/providers
    auth: authenticated
    permissions: "capability providerAdmin (AIAgentProvider edit)"
    request: "ProviderConnectionCreateSchema { kind: openai-compatible|anthropic|fake, key, label, baseUrl, models[1..100], dataClasses?, apiKey?, config{allowLoopback?,organization?,authHeader?}, enabled? } (strict)"
    response: "201 ProviderConnectionView — apiKey is write-only and never returned"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, DUPLICATE_RECORD]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_provider_connections row with api_key_encrypted (AES-256-GCM via ENCRYPTION_KEY); baseUrl SSRF-checked]
    idempotency: none; a duplicate key answers 409
  - method: PATCH
    path: /api/v1/AIAgents/action/providers/:key
    auth: authenticated
    permissions: "capability providerAdmin (AIAgentProvider edit)"
    request: "ProviderConnectionPatchSchema { label?, baseUrl?, models?, dataClasses?, apiKey? (omit keeps, null clears), config?, enabled? } (strict)"
    response: "200 ProviderConnectionView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_provider_connections row updated; apiKey re-encrypted when supplied, cleared on null]
    idempotency: a repeat with the same body is a no-op
  - method: DELETE
    path: /api/v1/AIAgents/action/providers/:key
    auth: authenticated
    permissions: "capability providerAdmin (AIAgentProvider edit)"
    request: none
    response: "200 { success: true }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_provider_connections row deleted; a key referenced by a published agent version answers 422 (disable instead)]
    idempotency: a second delete answers 404
  - method: POST
    path: /api/v1/AIAgents/action/providers/:key/check
    auth: authenticated
    permissions: "capability providerAdmin (AIAgentProvider edit)"
    request: "ProviderCheckSchema { model?, prompt? } (strict; prompt <= 500 chars)"
    response: "200 { ok, connectionKey, model, latencyMs, category, message, providerRequestId, usage } — never the model text or the credential"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [one real outbound provider call (16-token probe); ai_agent_provider_requests ledger row]
    idempotency: none; each call is a fresh provider request
  - method: GET
    path: /api/v1/AIAgents/action/tools
    auth: authenticated
    permissions: "capability use (AIAgent read)"
    request: none
    response: "200 { tools: [{key,label,effectClass,enabled}] } — the registered tool catalogue"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "service-defined order"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/templates
    auth: authenticated
    permissions: "capability use (AIAgent read)"
    request: none
    response: "200 { list: [{key,name,description,icon,config}] } — reviewed read-only starter configs"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed catalogue order"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/agents
    auth: authenticated
    permissions: "capability use (AIAgent read); results are visibility-scoped to organization agents, owned agents, owning-team agents, or everything for admin/publish holders; scope=mine narrows to the caller"
    request: "query: offset?, maxSize? (default 20, max 50), status? (draft|published|paused|archived), q? (name/key substring), scope? (mine)"
    response: "200 { list: AgentView[], total, offset, count } — AgentView includes draftConfig, configIssues, tools, capabilities, latestVersion"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, FEATURE_DISABLED]
    pagination: "offset (default 0) and maxSize (default 20, capped at 50); total is the filtered count"
    sorting: "fixed: modified_at descending"
    filtering: "status enum (unknown value refused), q ilike on name/agent_key, scope=mine"
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/agents/:id
    auth: authenticated
    permissions: "capability use (AIAgent read); a hidden agent answers 404 exactly like a missing one"
    request: none
    response: "200 AgentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/agents
    auth: authenticated
    permissions: "capability manageDraft (AIAgent edit)"
    request: "AgentCreateSchema { key, name, description?, purpose?, category?, icon?, visibility? (private|team|organization, default team), teamId?, config } (strict)"
    response: "201 AgentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, DUPLICATE_RECORD, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents row created as draft owned by the caller]
    idempotency: none; a duplicate agent key answers 409
  - method: PATCH
    path: /api/v1/AIAgents/action/agents/:id
    auth: authenticated
    permissions: "capability manageDraft (AIAgent edit) plus edit rights: owner, owning team or administrator; archived agents refuse edits"
    request: "AgentUpdateSchema { name?, description?, purpose?, category?, icon?, visibility?, teamId?, config? } (strict)"
    response: "200 AgentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents row updated; draft_config and data_sensitivity change when config is sent]
    idempotency: a repeat with the same body is a no-op
  - method: DELETE
    path: /api/v1/AIAgents/action/agents/:id
    auth: authenticated
    permissions: "capability manageDraft (AIAgent edit) plus owner/owning-team/administrator; only a never-published draft may be deleted"
    request: none
    response: "200 { success: true }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents.is_deleted set; published or paused agents must be archived instead]
    idempotency: a second delete answers 404
  - method: GET
    path: /api/v1/AIAgents/action/agents/:id/versions
    auth: authenticated
    permissions: "agent visibility only (organization, owner or owning team); no module capability is asserted on this route"
    request: none
    response: "200 { list: AgentVersionView[] } ordered by version descending"
    errors: [AUTHENTICATION_REQUIRED, NOT_FOUND]
    pagination: none
    sorting: "fixed: version descending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/agents/:id/versions/:version
    auth: authenticated
    permissions: "agent visibility only (organization, owner or owning team); no module capability is asserted on this route"
    request: "path :version must be a positive integer"
    response: "200 AgentVersionDetail { id, version, checksum, providerKey, model, publishedById, publishedAt, note, tools[], config, limits, approvalPolicy, memoryPolicy, triggerPolicy, outputSchema }"
    errors: [AUTHENTICATION_REQUIRED, INVALID_QUERY, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/agents/:id/validate
    auth: authenticated
    permissions: "capability use (AIAgent read); agent visibility applies"
    request: none
    response: "200 AgentValidationReport { ok, issues[{code,path,message,blocking}], checks[{id,ok,detail}] }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/validate
    auth: authenticated
    permissions: "capability use (AIAgent read); agent visibility applies"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AgentValidationReport — same as GET"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/publish
    auth: authenticated
    permissions: "capability publish (AIAgentVersion edit) plus owner/owning-team/administrator; evaluation publication gate may additionally refuse"
    request: "AgentPublishSchema { note?, checksum? } (strict)"
    response: "200 { agent: AgentView, version: AgentVersionView, report: AgentValidationReport }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agent_versions row (immutable snapshot + checksum), ai_agent_tool_grants rows, ai_agents status->published and current_version, scheduled_jobs row reconciled; all in one transaction]
    idempotency: none; republishing an identical draft answers 422
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/pause
    auth: authenticated
    permissions: "capability lifecycle (AIAgentLifecycle edit) plus owner/owning-team/administrator; only a published agent may pause"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AgentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents.status -> paused; scheduled_jobs row disabled]
    idempotency: a repeat on a paused agent answers 422
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/resume
    auth: authenticated
    permissions: "capability lifecycle (AIAgentLifecycle edit) plus owner/owning-team/administrator; only a paused agent may resume and its validation must have no blocking findings"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AgentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents.status -> published; scheduled_jobs row reconciled]
    idempotency: a repeat on a published agent answers 422
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/archive
    auth: authenticated
    permissions: "capability lifecycle (AIAgentLifecycle edit) plus owner/owning-team/administrator; any non-archived status may archive"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AgentView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents.status -> archived; scheduled_jobs row disabled]
    idempotency: a repeat on an archived agent answers 422
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/restore
    auth: authenticated
    permissions: "capability lifecycle (AIAgentLifecycle edit) plus owner/owning-team/administrator; only an archived agent may restore"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AgentView — status draft with the published config copied into draft_config; version rows are never mutated"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agents row (status->draft, draft_config replaced); scheduled_jobs row reconciled]
    idempotency: a repeat on a draft agent answers 422
  - method: GET
    path: /api/v1/AIAgents/action/runs
    auth: authenticated
    permissions: "capability use (AIAgent read); without the audit capability only runs the caller initiated are listed; scope=all widens to all runs for audit holders"
    request: "query: offset?, maxSize? (default 25, max 100), status? (13-value run status enum), agentId?, scope? (all)"
    response: "200 { list: AIAgentRunView[], total, offset, count } — includes counters and truncated input"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY]
    pagination: "offset (default 0) and maxSize (default 25, capped at 100); total is the filtered count"
    sorting: "fixed: created_at descending"
    filtering: "status enum (unknown value refused), agentId, scope=all"
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/agents/:id/runs
    auth: authenticated
    permissions: "capability use (AIAgent read) plus execution enabled and not globally paused; agent must be published and visible to the caller"
    request: "RunCreateSchema { input?{text?, record?{entity,id}, records?[{entity,id} max 8]}, idempotencyKey? (8-120 chars), conversationId? } (strict)"
    response: "201 AIAgentRunView — status queued; execution happens asynchronously via the job queue"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, RATE_LIMITED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agent_runs row (queued, 24h expiry), optional ai_agent_conversations/messages rows, run.queued timeline event, BullMQ job enqueue, quota and per-user rate checks; record refs are ACL-checked at creation]
    idempotency: "idempotencyKey is unique-indexed; a repeat returns the existing run"
  - method: GET
    path: /api/v1/AIAgents/action/runs/:id
    auth: authenticated
    permissions: "capability use (AIAgent read); only the initiating user or an audit-capability holder may see the run (404 otherwise)"
    request: none
    response: "200 AIAgentRunView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/runs/:id/events
    auth: authenticated
    permissions: "capability use (AIAgent read); run visibility as GET /runs/:id; without audit only 'user'-visibility events are returned"
    request: none
    response: "200 { list: AIAgentRunEventView[] } ordered by seq ascending"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: "fixed: seq ascending"
    filtering: "visibility=user for non-audit callers"
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AIAgents/action/runs/:id/toolCalls
    auth: authenticated
    permissions: "capability use (AIAgent read); run visibility as GET /runs/:id"
    request: none
    response: "200 { list: [{id,step,toolKey,policyResult,status,summary,errorCategory,durationMs,resultRef,createdAt}] } ordered by created_at"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: "fixed: created_at ascending"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/runs/:id/retry
    auth: authenticated
    permissions: "capability use (AIAgent read); run visibility as GET /runs/:id; only failed/canceled/expired/blocked_by_policy runs may retry"
    request: "RunRetrySchema { idempotencyKey? } (strict)"
    response: "200 AIAgentRunView — the NEW run created from the old one's stored input"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, RATE_LIMITED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [new ai_agent_runs row (causation_id points at the retried run), run.retried timeline event, job enqueue, conversation/message rows as for a normal run]
    idempotency: "idempotencyKey dedups the new run; runs with outcome_unknown tool calls are refused"
  - method: POST
    path: /api/v1/AIAgents/action/runs/:id/cancel
    auth: authenticated
    permissions: "capability use (AIAgent read); run visibility as GET /runs/:id"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AIAgentRunView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agent_runs.cancel_requested/status update; queued/waiting runs end canceled immediately; pending approvals invalidated; run.canceled/cancel_requested event; conversation outcome message]
    idempotency: "a repeat on a terminal run returns the run unchanged"
  - method: POST
    path: /api/v1/AIAgents/action/runs/:id/input
    auth: authenticated
    permissions: "capability use (AIAgent read); run visibility as GET /runs/:id; only a run in waiting_for_input may receive input"
    request: "RunInputSchema { text } (1-4000 chars, strict)"
    response: "200 AIAgentRunView — status returns to queued"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agent_runs.input merged and status->queued; run.input_received timeline event]
    idempotency: none; each call overwrites the pending input text
  - method: POST
    path: /api/v1/AIAgents/action/runs/:id/resume
    auth: authenticated
    permissions: "capability use (AIAgent read); run visibility as GET /runs/:id; only waiting_for_input/waiting_for_approval runs change state"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 AIAgentRunView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agent_runs.status -> queued when waiting; run.resumed timeline event]
    idempotency: safe to repeat; a non-waiting run is returned unchanged
  - method: POST
    path: /api/v1/AIAgents/action/runs/:id/execute
    auth: authenticated
    permissions: "capability use (AIAgent read) via the visibility check; the run owner or an audit holder may re-attempt a queued run"
    request: "EmptyBodySchema (strict empty object)"
    response: "200 { run: AIAgentRunView, claimed, waitingForApproval }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [lease-claimed execution of the run: model calls to the configured provider, tool executions, ai_agent_run_events/tool_calls/provider_requests rows, run counters and terminal status]
    idempotency: "lease claim makes a duplicate dispatch a no-op; terminal runs return untouched"
  - method: POST
    path: /api/v1/AIAgents/action/triggers/run
    auth: authenticated
    permissions: "capability policyAdmin (AIAgentPolicy edit) plus execution enabled"
    request: "RunTriggerSchema { agentId, trigger: event|schedule|integration|record, input?{text?,record?,records?}, idempotencyKey?, causationId?, depth? (0-10) } (strict)"
    response: "200 AIAgentRunView — a queued run started as the calling principal"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, FEATURE_DISABLED, RATE_LIMITED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [ai_agent_runs row, timeline events, job enqueue, conversation rows; feature flags eventTriggers/scheduledTriggers and the agent's own trigger allowlist and depth<=3 are enforced]
    idempotency: "idempotencyKey dedups the run"
  - method: GET
    path: /api/v1/AIAgents/action/mcp/tools
    auth: authenticated
    permissions: "capability use (AIAgent read)"
    request: none
    response: "200 { tools: [{name,description,inputSchema}] } — MCP-shaped tool list"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "registry order"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AIAgents/action/mcp/call
    auth: authenticated
    permissions: "capability use (AIAgent read); the tool executes as the calling user — approval-gated tools are refused because a direct call has no run to attach a decision to"
    request: "{ name, arguments?, idempotencyKey? } (strict inline schema)"
    response: "200 { content: [{type:text, text}], isError:false, toolCallId? }"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [the tool's own effect (CRM reads/writes under the caller's ACL); ai_agent_mcp_direct_calls claim/complete rows for write-capable tools]
