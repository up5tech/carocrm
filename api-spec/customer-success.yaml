    path: /api/v1/CustomerSuccess/action/repair-stale-playbook-runs
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ScanSchema { limit? (1..1000, default 500) } — today is accepted but unused (strict)"
    response: "200 StaleRunRepair { processed, skipped, repaired, errors, durationMs } — runs untouched for 30+ days"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
