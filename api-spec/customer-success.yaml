  # ---------------------------------------------------------------------------
  # Worker-authorized operations (§11.1): @Public, authorised by the shared worker→API
  # capability in the x-worker-secret header (constant-time compare, refused when unset).
  # Each runs as the documented system principal (sysAdmin role) and is a bounded,
  # re-runnable scan.
  # ---------------------------------------------------------------------------
  - method: POST
    path: /api/v1/CustomerSuccess/action/recalculate-batch
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "BulkRecalculateSchema { limit? (1..1000, default 200) } (strict)"
    response: "200 RecalculateBatchScan { processed, skipped, errors, ids[], durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [health snapshots and profile health fields for up to limit profiles, recalculation events]
    idempotency: bounded re-runnable scan; unchanged signatures write no snapshot
  - method: POST
    path: /api/v1/CustomerSuccess/action/expire-overrides
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ExpireOverridesSchema { today? (YYYY-MM-DD), limit? (1..1000, default 200) } (strict)"
    response: "200 ExpireOverrideScan { processed, skipped, expired, errors, durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [expired health overrides cleared on up to limit profiles]
    idempotency: bounded re-runnable scan; an already-expired override counts as skipped
  - method: POST
    path: /api/v1/CustomerSuccess/action/update-goal-overdue-state
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ScanSchema { today? (YYYY-MM-DD), limit? (1..1000, default 500) } (strict)"
    response: "200 GoalOverdueScan { processed, updated, cleared, skipped, errors, notified, durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [goal overdue flags updated/cleared, notifications to overdue recipients]
    idempotency: bounded re-runnable scan
  - method: POST
    path: /api/v1/CustomerSuccess/action/evaluate-renewal-windows
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ScanSchema { today? (YYYY-MM-DD), limit? (1..1000, default 500) } (strict)"
    response: "200 RenewalWindowScan { processed, skipped, entered, errors, durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [profiles newly entering a renewal window recorded/notified per settings]
    idempotency: bounded re-runnable scan; already-entered windows are skipped
  - method: POST
    path: /api/v1/CustomerSuccess/action/evaluate-risk-escalations
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ScanSchema { today? (YYYY-MM-DD), limit? (1..1000, default 500) } (strict)"
    response: "200 RiskEscalationScan { processed, candidates, notified, skipped, errors, durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [risk escalation evaluations, notifications to escalation teams]
    idempotency: bounded re-runnable scan
  - method: POST
    path: /api/v1/CustomerSuccess/action/evaluate-review-reminders
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ScanSchema { today? (YYYY-MM-DD), limit? (1..1000, default 500) } (strict)"
    response: "200 ReviewReminderScan { processed, skipped, notified, errors, due[{profileId,reviewDate}], durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [review reminders notified to the responsible users]
    idempotency: bounded re-runnable scan; notification dedup keys suppress repeats
  - method: POST
    path: /api/v1/CustomerSuccess/action/process-playbook-wait-steps
    auth: public
    permissions: "worker capability (x-worker-secret header)"
    request: "ScanSchema { today? (YYYY-MM-DD), limit? (1..1000, default 500) } (strict)"
    response: "200 PlaybookWaitScan { processed, skipped, resumed, errors, durationMs }"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [waitUntil step runs whose date arrived resumed; producers may create Task/Risk/Plan records]
    idempotency: bounded re-runnable scan; resumed steps leave the pending-wait set
