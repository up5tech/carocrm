  # -------------------------------------------------------------------------
  # worker-authorized operations — @Public() routes authorized by the shared
  # worker→API capability in the x-worker-secret header (constant-time compare
  # against REPORT_WORKER_SECRET; refused when unset). No user session exists.
  # -------------------------------------------------------------------------
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/outbound-event
    auth: public
    permissions: "worker capability (x-worker-secret)"
    request: "body: OutboundEventSchema { eventId, eventType, entityType, entityId } — strict; delivered by the worker for a CRM domain event"
    response: "200 OutboundEventResult { queued, echoes, unmapped } — counts of outbound operations created vs skipped by the echo guard"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_outbound_operations rows (idempotency-keyed), advancedIntegrations.pushOutbound jobs enqueued]
    idempotency: "the operation idempotency key is derived from connection+mapping+record+event, so a redelivered event queues nothing twice"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/process-webhook-event
    auth: public
    permissions: "worker capability (x-worker-secret)"
    request: "body: WebhookProcessSchema { connectionId, deliveryId, providerKey, objectType, externalId?, eventType, handled? } — strict"
    response: "200 { status, outcome } — already_processed when the receipt was processed before"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_webhook_deliveries status processed/failed, CRM record writes via the mapping path, integration_external_links, sync operations]
    idempotency: "the receipt status is the guard: a processed delivery answers already_processed and applies nothing twice"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/push-outbound
    auth: public
    permissions: "worker capability (x-worker-secret)"
    request: "body: OutboundPushSchema { operationId } — strict"
    response: "200 OutboundOperationView — an already-applied operation returns unchanged"
    errors: [AUTHENTICATION_FAILED, INVALID_QUERY, NOT_FOUND, INTERNAL_ERROR]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [provider upsert/delete call, integration_outbound_operations status/attempts/error, integration_external_links, record-origin row]
    idempotency: "an applied operation is a no-op; failures after 5 attempts become dead_letter"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/notify-expiring-credentials
    auth: public
    permissions: "worker capability (x-worker-secret)"
    request: none
    response: "200 { notified, expired, purgedStates } — expiry sweep counts"
    errors: [AUTHENTICATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_oauth_states expired rows deleted, notifications rows (deterministic ids), connections moved to reauthorization_required when a credential expired]
    idempotency: "deterministic notification ids make a re-run add nothing"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/purge-retention
    auth: public
    permissions: "worker capability (x-worker-secret)"
    request: none
    response: "200 RetentionPurgeReport — same purge as the admin route, under service authority"
    errors: [AUTHENTICATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [same bounded retention deletes/clears as action/retention/purge]
    idempotency: "a second pass finds nothing left"
  # -------------------------------------------------------------------------
  # OAuth callback — @Public(): the provider redirects the administrator's
  # browser here with no session. Security is the single-use hashed state
  # (consumed atomically, bound to connection+provider+initiator), the
  # allowlisted constant redirect URI, and PKCE. Answers 302 to /admin/settings.
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/integrations/advanced-integrations/oauth/callback
    auth: public
    permissions: "state-bound OAuth callback (single-use state, PKCE, allowlisted redirect_uri)"
    request: "query: OAuthCallbackSchema { state, code?, error?, error_description?, redirect_uri? } — strict; redirect_uri is compared, never used"
    response: "302 redirect to /admin/settings?integrationConnection=<id>&integrationStatus=<connected|reauthorization_required>"
    errors: [BAD_REQUEST, AUTHENTICATION_FAILED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_oauth_states row consumed, vault token rows (access/refresh) stored, connection status connected or reauthorization_required, audit trail — the authorization code is never persisted or logged]
    idempotency: "the state is consumed atomically; a replay finds nothing and is refused"
  # -------------------------------------------------------------------------
  # inbound provider webhook — @Public(): the provider holds no CRM session.
  # The path segment is an opaque webhook key (not enumerable); the connector
  # verifies the provider signature before anything is recorded. Answers 202
  # after verification; processing runs in a worker job.
  # -------------------------------------------------------------------------
  - method: POST
    path: /api/v1/integrations/advanced-integrations/:providerKey/:webhookKey/:kind
    auth: public
    permissions: "provider signature (verified by the connector against the vault-held webhook secret)"
    request: "raw body + provider headers/query — the exact bytes the provider signed; kind is the event kind segment"
    response: "202 { status: accepted|duplicate, eventCount } or 401 { status: rejected, eventCount: 0 } — no error.code envelope; a rejected delivery will fail the same way forever so the provider should stop retrying"
    errors: []
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_webhook_deliveries receipt rows (rejected receipts carry no payload), advancedIntegrations.processWebhookEvent jobs enqueued, security events on rejected signatures/replays]
    idempotency: "(connection_id, delivery_id) dedup: a repeated delivery is acknowledged as duplicate and never processed twice"
