# PLAN §58 — advanced integrations control plane. Source:
# apps/api/src/advanced-integrations/advanced-integrations.controller.ts,
# oauth-callback.controller.ts, webhook.controller.ts and the services they call
# (connection-lifecycle, oauth-flow, mapping, sync-orchestrator, conflict, dead-letter,
# webhook-ingress, outbound-sync, enrichment, connection-detail, settings, health,
# metrics, retention, audit).
#
# Every route checks a module capability server-side (AdvancedIntegrationsPermissionService);
# the capabilities are the ACL resources declared in advanced-integrations-module.ts:
# use, providerAdmin, connectionAdmin, credentialAdmin, authorize, settingsAdmin, diagnostics.
# Connections carry vault-encrypted credentials that are write-only; non-administrator callers
# only see connections they own (owner_type 'user' + owner_id = caller).
#
# The generic record API these routes write through is documented in entities.yaml.
group: advanced-integrations
basePath: /api/v1
endpoints:
  # -------------------------------------------------------------------------
  # diagnostics
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/health
    auth: authenticated
    permissions: use
    request: none
    response: "200 ModuleHealthView { module, ok, dependencies[], providers[], features[], warnings[] } — encryption key presence, registered providers, feature flags"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/capabilities
    auth: authenticated
    permissions: use
    request: none
    response: "200 { capabilities: [{ key, label, description, granted }] } — every module right with whether this caller holds it"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/nav
    auth: authenticated
    permissions: use
    request: none
    response: "200 navigation visibility { visible, admin } — the module's own navigation signal"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # settings
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/settings
    auth: authenticated
    permissions: settingsAdmin
    request: none
    response: "200 AdvancedIntegrationsSettingsView { settings, version, updatedAt, updatedBy, defaults, warnings } — the app_settings row 'AdvancedIntegrations'"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/settings
    auth: authenticated
    permissions: settingsAdmin
    request: "body: partial settings document (features, oauth, notifications, health, retention); unknown keys are refused"
    response: "200 AdvancedIntegrationsSettingsView — merged, validated, version bumped"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [app_settings row 'AdvancedIntegrations' upserted, settings version incremented]
    idempotency: "idempotent for the same merged document"
  # -------------------------------------------------------------------------
  # provider catalog
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/providers
    auth: authenticated
    permissions: providerAdmin
    request: none
    response: "200 { list: ProviderDescription[] } — the connector catalog with capabilities; never a secret"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/providers/:providerKey
    auth: authenticated
    permissions: providerAdmin
    request: none
    response: "200 ProviderDescription — one connector's declared capabilities, scopes and objects"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # connections
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: IntegrationConnectionView[] } — connections the caller may see; a non-administrator sees only user-owned connections of their own; credentials are never returned, only hasCredential and a kind/expiry hint"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: provider_key asc, name asc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections
    auth: authenticated
    permissions: connectionAdmin
    request: "body: ConnectionCreateSchema { providerKey, name, ownerType? (organization|user), ownerId?, tenantRef?, connectionOptions? } — strict; connectionOptions may not smuggle a credential"
    response: "201 IntegrationConnectionView — created in status draft, enabled false"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, DUPLICATE_RECORD]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_connections row (draft), integration_audit_log row, webhook_key generated for webhook-capable providers]
    idempotency: none; each call creates a connection (unique name per provider+owner enforced)
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id
    auth: authenticated
    permissions: use
    request: none
    response: "200 IntegrationConnectionView — status, scopes, health, hasCredential; never the credential value"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: PATCH
    path: /api/v1/AdvancedIntegrations/action/connections/:id
    auth: authenticated
    permissions: connectionAdmin
    request: "body: ConnectionPatchSchema { name?, tenantRef?, connectionOptions?, enabled? } — strict"
    response: "200 IntegrationConnectionView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_connections row, integration_audit_log rows (updated, enabled/disabled)]
    idempotency: "idempotent for the same body"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/credentials
    auth: authenticated
    permissions: credentialAdmin
    request: "body: CredentialWriteSchema { kind (api_key|client_secret|webhook_secret|signing_secret), value, expiresAt? } — value is write-only"
    response: "200 IntegrationConnectionView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [credential vault row (encrypted with ENCRYPTION_KEY), integration_connections credential_reference_id, integration_audit_log row — the value is never stored in plaintext or returned]
    idempotency: "replaces the stored credential of that kind"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/pause
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 IntegrationConnectionView — status paused; no provider call may run through it"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_connections status paused, integration_audit_log rows]
    idempotency: "a paused connection cannot be paused again (state machine refuses)"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/resume
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 IntegrationConnectionView — status connected; missing required scopes move it to reauthorization_required and answer VALIDATION_FAILED instead"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_connections status connected or reauthorization_required, integration_audit_log rows]
    idempotency: safe to repeat once connected
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/revoke
    auth: authenticated
    permissions: authorize
    request: none
    response: "200 IntegrationConnectionView — status revoked; provider grant revocation attempted when the adapter supports it"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [vault credentials revoked, integration_connections status revoked + credential_reference_id cleared, integration_oauth_states deleted later on remove, integration_audit_log rows]
    idempotency: "a revoked connection cannot be revoked again (state machine refuses)"
  - method: DELETE
    path: /api/v1/AdvancedIntegrations/action/connections/:id
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 { success: true } — soft delete; synced CRM records are never touched"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [vault credentials removed, integration_connections deleted_at set + status revoked + enabled false, integration_oauth_states rows deleted, integration_audit_log row]
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # authorization (OAuth)
  # -------------------------------------------------------------------------
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/authorize
    auth: authenticated
    permissions: authorize
    request: "body: AuthorizeSchema { scopes? } — strict; scopes may only narrow the provider's declared set"
    response: "200 OAuthAuthorizationStartResult { connectionId, authorizationUrl, expiresAt, scopes } — the browser is sent to the provider"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_oauth_states row (hashed single-use state + PKCE verifier), connection status pending_authorization, audit trail]
    idempotency: none; each call starts a new flow
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/reconnect
    auth: authenticated
    permissions: authorize
    request: "body: AuthorizeSchema { scopes? } — strict"
    response: "200 OAuthAuthorizationStartResult — same as authorize, for a connection whose grant is no longer usable"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_oauth_states row, connection status pending_authorization]
    idempotency: none; each call starts a new flow
  # -------------------------------------------------------------------------
  # external id links
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id/links
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: ExternalLinkView[] } — provider object ↔ CRM record links, ordered object_type, external_id"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: "fixed: object_type asc, external_id asc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # mappings
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/mappings
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: ObjectMappingView[] } — every ACTIVE mapping in the installation (not just the caller's connections')"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: connection_id asc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/mappings
    auth: authenticated
    permissions: connectionAdmin
    request: "body: MappingCreateSchema { providerKey, connectionId?, objectType, crmEntityType, direction?, syncMode?, conflictPolicy?, deletionPolicy?, fieldAuthority?, fields[] } — strict; connectionId required when the provider has several connections"
    response: "201 ObjectMappingView — created in status draft, mapping_version 1"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_object_mappings row, integration_field_mappings rows, integration_audit_log row]
    idempotency: none; each call creates a mapping
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/mappings/:id
    auth: authenticated
    permissions: use
    request: none
    response: "200 ObjectMappingView — with its field mappings"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: PATCH
    path: /api/v1/AdvancedIntegrations/action/mappings/:id
    auth: authenticated
    permissions: connectionAdmin
    request: "body: MappingPatchSchema { crmEntityType?, direction?, syncMode?, conflictPolicy?, deletionPolicy?, fieldAuthority?, fields[] } — strict; field transforms are recompiled and refused when invalid"
    response: "200 ObjectMappingView — mapping_version incremented"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_object_mappings row (version bump), integration_field_mappings rows replaced]
    idempotency: "idempotent for the same body; version increments per call"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/mappings/:id/activate
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 ObjectMappingView — status active; any other active mapping for the same connection+object is retired"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_object_mappings status changes, integration_audit_log row]
    idempotency: "activating an already-active mapping retires nothing new; safe to repeat"
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/mappings/:id/retire
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 ObjectMappingView — status retired; history kept"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_object_mappings status retired, integration_audit_log row]
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/mappings/:id/preview
    auth: authenticated
    permissions: use
    request: "body: MappingPreviewSchema { sample: object } — a sample provider object; strict"
    response: "200 PreviewResult { mappingId, mappingVersion, values, missingRequired, emptySources, dryRun: true } — nothing is written"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # sync runs
  # -------------------------------------------------------------------------
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/mappings/:id/sync
    auth: authenticated
    permissions: connectionAdmin
    request: "body: SyncRunSchema { runType?, triggerSource?, maxRecords? (1-1000), pageSize? (1-1000) } — strict; the body may be empty"
    response: "200 SyncRunView — the run executes synchronously in the request and returns its final state with record counters"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND, INTERNAL_ERROR]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_sync_runs row, integration_sync_operations rows, integration_sync_checkpoints cursor, CRM records created/updated via the entity engine under the connection owner's authority, integration_external_links rows, integration_conflicts rows, integration_dead_letters row on failure, integration.record.* domain events, provider page/delta reads]
    idempotency: "per-record idempotency keys on operations; the checkpoint makes a repeated run continue rather than rewrite"
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id/runs
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: SyncRunView[] } — newest first, capped at 50"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: "none (fixed limit 50)"
    sorting: "fixed: created_at desc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/runs/:id
    auth: authenticated
    permissions: use
    request: none
    response: "200 SyncRunView — status, counters, cursors, last error"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/runs/:id/cancel
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 SyncRunView — status cancelled; a running loop stops at the next page boundary and keeps applied pages"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_sync_runs status cancelled + finished_at]
    idempotency: "a finished run cannot be cancelled again (VALIDATION_FAILED)"
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/runs/:id/operations
    auth: authenticated
    permissions: use
    request: "query: status?, limit? (1-500, default 100)"
    response: "200 { list: SyncOperationView[] } — the operations of a run, oldest first, with retryable flag"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: "limit query param, default 100, max 500"
    sorting: "fixed: created_at asc"
    filtering: "status equals one of pending|applied|skipped|failed|dead_letter"
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/operations/:id/retry
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 { id, status: pending, attempts } — only a failed or dead-lettered operation can be retried; nothing is queued"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_sync_operations status pending, attempts+1, error cleared — the run and checkpoint are untouched]
    idempotency: "the next delivery of that record reuses the same idempotency key"
  # -------------------------------------------------------------------------
  # conflicts
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id/conflicts
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: ConflictView[] } — open conflicts only, capped at 100"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: "none (fixed limit 100)"
    sorting: "fixed: created_at desc"
    filtering: "status=open only"
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/conflicts/:id
    auth: authenticated
    permissions: use
    request: none
    response: "200 ConflictDetailView — snapshots, conflicting fields, field authority, stale flag and which resolutions are enabled"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/conflicts/:id/resolve
    auth: authenticated
    permissions: connectionAdmin
    request: "body: ConflictResolveSchema { resolution: keep_crm|keep_provider|ignore|unlink } — strict"
    response: "200 ConflictView — status resolved or ignored; keep_provider writes the remote snapshot to the CRM record unless the conflict is stale"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED, NOT_FOUND, RECORD_NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_conflicts status/resolution/resolved_by, CRM record update on keep_provider, integration_audit_log row]
    idempotency: "an already-resolved conflict answers VALIDATION_FAILED"
  # -------------------------------------------------------------------------
  # dead letters
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id/dead-letters
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: DeadLetterView[] } — open dead letters only, capped at 100; redacted error code/category/detail, never a credential"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: "none (fixed limit 100)"
    sorting: "fixed: created_at desc"
    filtering: "status=open only"
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/dead-letters/:id/replay
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 DeadLetterView — status replayed, stamped with the run that re-ran the failed mapping"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, INTERNAL_ERROR]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [a fresh inbound sync run for the recorded mapping (provider reads, CRM writes, sync rows), integration_dead_letters status replayed]
    idempotency: "only an open letter with a recorded mapping can be replayed; a failed re-run leaves the letter open"
  # -------------------------------------------------------------------------
  # webhook deliveries
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id/webhook-deliveries
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: WebhookDeliveryReceipt[] } — receipts newest first, capped at 100; payload shape only while debug mode is active"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: "none (fixed limit 100)"
    sorting: "fixed: received_at desc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # outbound operations
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/connections/:id/outbound
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: OutboundOperationView[] } — queued/applied/failed outbound pushes, capped at 100"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: "none (fixed limit 100)"
    sorting: "fixed: created_at desc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  # -------------------------------------------------------------------------
  # provider subscription renewal
  # -------------------------------------------------------------------------
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/connections/:id/renew-subscriptions
    auth: authenticated
    permissions: connectionAdmin
    request: none
    response: "200 provider renewal result — renews push subscriptions (e.g. Microsoft Graph) through the connector"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, VALIDATION_FAILED, NOT_FOUND, INTERNAL_ERROR]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [provider subscription API calls, provider-side subscription renewal]
    idempotency: "provider-dependent; a repeat renews the same subscriptions again"
  # -------------------------------------------------------------------------
  # enrichment (19-INT.24)
  # -------------------------------------------------------------------------
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/enrichment/profiles
    auth: authenticated
    permissions: use
    request: none
    response: "200 { list: EnrichmentProfileView[] } — ordered by name"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED]
    pagination: none
    sorting: "fixed: name asc"
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: GET
    path: /api/v1/AdvancedIntegrations/action/enrichment/profiles/:id
    auth: authenticated
    permissions: use
    request: none
    response: "200 EnrichmentProfileView"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: none
    idempotency: safe to repeat
  - method: POST
    path: /api/v1/AdvancedIntegrations/action/enrichment/profiles
    auth: authenticated
    permissions: connectionAdmin
    request: "body: EnrichmentProfileCreateSchema { providerKey, connectionId, name, entityType, allowedFields[], protectedFields?, dailyQuota?, costPerCredit?, cacheTtlSeconds?, providerOptions?, enabled? } — strict; providerOptions may not hold a credential"
    response: "201 EnrichmentProfileView — disabled unless enabled is set"
    errors: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, INVALID_QUERY, VALIDATION_FAILED]
    pagination: none
    sorting: none
    filtering: none
    sideEffects: [integration_enrichment_profiles row, integration_audit_log row]
    idempotency: none; each call creates a profile
  - method: PATCH
    path: /api/v1/AdvancedIntegrations/action/enrichment/profiles/:id
    auth: authenticated
    permissions: connectionAdmin
    request: "body: EnrichmentProfilePatchSchema { name?, enabled?, allowedFields?, protectedFields?, dailyQuota?, costPerCredit?, cacheTtlSeconds?, providerOptions? } — strict"
    response: "200 EnrichmentProfileView"
